workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never

stages:
  - release

release_dmg:
  stage: release
  tags:
    - macos-arm64
  resource_group: lens-release
  interruptible: false
  script:
    - test "$(uname -s)" = "Darwin"
    - test "$(uname -m)" = "arm64"
    - xcodebuild -version
    - export LENS_RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - export LENS_BUILD_NUMBER="${CI_PIPELINE_IID}"
    - test -n "${CI_PAGES_URL}"
    - test -f "${LENS_SPARKLE_PRIVATE_KEY}"
    - export LENS_UPDATE_FEED_URL="${CI_PAGES_URL}/appcast.xml"
    - export LENS_UPDATE_DOWNLOAD_BASE_URL="${CI_PAGES_URL}"
    - export LENS_UPDATE_RELEASE_PAGE_URL="${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}"
    - ./Scripts/release_github_gitlab.sh
    - ./Scripts/ci_publish_gitlab_release.sh
  pages:
    publish: dist/update-feed
  artifacts:
    name: "Lens-${CI_COMMIT_TAG}-macos-arm64"
    when: always
    expire_in: 1 week
    paths:
      - dist/Lens-*-macos-arm64.dmg.sha256
      - dist/INSTALL.md
